
name: CI

# Pull-request and post-merge quality gate for develop and main.
# Frontend and backend checks run once each application is introduced.
# Branch protection and required status checks are configured in GitHub
# repository settings, never from this workflow. See docs/ci.md.

on:
  push:
    branches:
      - develop
      - main
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect frontend
        id: frontend
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -f frontend/package.json ]; then
            for file in frontend/package-lock.json frontend/.nvmrc; do
              if [ ! -f "$file" ]; then
                echo "::error::$file is required but missing."
                exit 1
              fi
            done

            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              echo "::error::Cannot verify frontend at base revision $BASE_SHA."
              exit 1
            fi

            if git cat-file -e "$BASE_SHA:frontend/package.json" 2>/dev/null; then
              echo "::error::frontend/package.json was removed; restore it."
              exit 1
            fi
          fi

          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "Frontend has not been introduced; skipping frontend checks."

      - name: Set up Node.js
        if: steps.frontend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        if: steps.frontend.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.frontend.outputs.present == 'true'
        run: npm run lint

      - name: Type check
        if: steps.frontend.outputs.present == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.frontend.outputs.present == 'true'
        run: npm run test

      - name: Build
        if: steps.frontend.outputs.present == 'true'
        run: npm run build

  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect backend
        id: backend
        working-directory: .
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -e backend ]; then
            if [ ! -d backend ]; then
              echo "::error::backend exists but is not a directory."
              exit 1
            fi

            for file in backend/package.json backend/package-lock.json backend/.nvmrc; do
              if [ ! -f "$file" ]; then
                echo "::error::$file is required because backend/ exists."
                exit 1
              fi
            done

            echo "present=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -n "$BASE_SHA" ] && [ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]; then
            if ! git cat-file -e "$BASE_SHA^{commit}" 2>/dev/null; then
              echo "::error::Cannot verify backend at base revision $BASE_SHA."
              exit 1
            fi

            if git cat-file -e "$BASE_SHA:backend/package.json" 2>/dev/null; then
              echo "::error::backend/package.json was removed; restore it."
              exit 1
            fi
          fi

          echo "present=false" >> "$GITHUB_OUTPUT"
          echo "Backend has not been introduced; skipping backend checks."

      - name: Set up Node.js
        if: steps.backend.outputs.present == 'true'
        uses: actions/setup-node@v4
        with:
          node-version-file: backend/.nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        if: steps.backend.outputs.present == 'true'
        run: npm ci

      - name: Lint
        if: steps.backend.outputs.present == 'true'
        run: npm run lint

      - name: Type check
        if: steps.backend.outputs.present == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.backend.outputs.present == 'true'
        run: npm run test

      - name: Build
        if: steps.backend.outputs.present == 'true'
        run: npm run build

  branch-name:
    name: Branch name validation
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate branch name
        env:
          EVENT_NAME: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          if [ "$EVENT_NAME" = "pull_request" ]; then
            branch="$HEAD_REF"
          else
            branch="$REF_NAME"
          fi

          if [ -z "$branch" ]; then
            echo "::error::Could not determine the branch name for this event."
            exit 1
          fi

          # develop and main are integration branches. Pushes to them are merge
          # commits, so topic-branch naming does not apply.
          if [ "$EVENT_NAME" = "push" ] && { [ "$branch" = "develop" ] || [ "$branch" = "main" ]; }; then
            echo "Integration branch '$branch' is exempt from topic-branch naming."
            exit 0
          fi

          spec_pattern='^(feat|docs|fix)/[0-9]{3}-[a-z0-9]+(-[a-z0-9]+)*$'
          other_pattern='^(chore|refactor)/[a-z0-9]+(-[a-z0-9]+)*$'

          if [[ "$branch" =~ $spec_pattern ]] || [[ "$branch" =~ $other_pattern ]]; then
            echo "Branch name '$branch' is valid."
            exit 0
          fi

          echo "::error::Invalid branch name '$branch'."
          echo "Specification branches must match feat/NNN-slug, docs/NNN-slug, or fix/NNN-slug."
          echo "Non-specification branches must match chore/slug or refactor/slug."
          echo "Use lowercase kebab-case; NNN is exactly three digits."
          exit 1
